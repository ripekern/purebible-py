[project]
name = "purebible"
version = "0.1.4"
description = "PureBible terminal client for nvim/btop/terminal lovers — vim-keys, btop-style TUI, zero dependencies"
readme = "README.md"
requires-python = ">=3.9"
license = "GPL-3.0-or-later"
dependencies = []
keywords = ["kjv", "bible", "bible-search", "king-james", "tui", "terminal", "curses", "vim"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console :: Curses",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Topic :: Religion",
  "Topic :: Terminals",
  "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/ripekern/purebible-py"
Repository = "https://github.com/ripekern/purebible-py.git"

[project.scripts]
purebible = "purebible.cli:main"
pb = "purebible.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["purebible*"]

[tool.setuptools.package-data]
purebible = ["data/*.txt"]
